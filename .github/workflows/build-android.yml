name: 🤖 Build Android APK

on:
  push:
    branches:
      - main
      - production
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/deploy-web.yml'
      - 'updater/**'

  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      version_override:
        description: 'Override version (leave blank to read from package.json)'
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      version:
        description: 'App version (passed from release workflow)'
        required: false
        type: string
        default: ''
      upload_url:
        description: 'GitHub Release upload URL for attaching APKs'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Checkout ───────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Bun ────────────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Determine version ──────────────────────────────────────
      - name: Resolve App Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [ -n "${{ inputs.version_override }}" ]; then
            VER="${{ inputs.version_override }}"
          else
            VER=$(node -p "require('./package.json').version")
          fi
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Resolved version: v$VER"

      # ── Java ───────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Android SDK & NDK ──────────────────────────────────────
      - name: Setup Android SDK & NDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Find or install NDK 26
          NDK_DIR=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || echo "")
          if [ -z "$NDK_DIR" ]; then
            echo "[CI] Installing NDK 26.1.10909125..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
              "ndk;26.1.10909125" \
              "build-tools;34.0.0" \
              "platforms;android-34"
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi

          echo "[CI] Using NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR"         >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      # ── Rust ───────────────────────────────────────────────────
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android-rust-${{ hashFiles('src-tauri/Cargo.lock') }}

      # ── JS deps ────────────────────────────────────────────────
      - name: Install Project Dependencies
        run: bun install

      # ── Sync version ───────────────────────────────────────────
      - name: Sync Version to Tauri config
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ] || [ -n "${{ inputs.version_override }}" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
              pkg.version = '${{ env.APP_VERSION }}';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          fi
          bun run version:sync

      # ── Tauri Android Init ─────────────────────────────────────
      - name: Initialize Tauri Android Project
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "[CI] Initializing Tauri Android project..."
            bun run tauri android init --ci
          else
            echo "[CI] Android project already initialized."
          fi

      # ── Inject Android Permissions ─────────────────────────────
      - name: Inject Android Permissions
        shell: bash
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "[CI] Ensuring Android permissions in $MANIFEST..."
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST"
              echo "[CI] Injected RECORD_AUDIO, MODIFY_AUDIO_SETTINGS, and INTERNET permissions."
            else
              echo "[CI] Permissions already present."
            fi
          fi

      # ── Build APKs ─────────────────────────────────────────────
      - name: Build Android Release APK
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        shell: bash
        run: |
          echo "[CI] Building Release APK — v${{ env.APP_VERSION }}..."
          bun run tauri android build --apk --ci --target aarch64 || \
          bun run tauri android build --apk --ci

      - name: Build Android Debug APK
        if: inputs.build_type == 'debug' || github.event.inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch'
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        shell: bash
        run: |
          echo "[CI] Building Debug APK — v${{ env.APP_VERSION }}..."
          bun run tauri android build --apk --debug --ci --target aarch64 || \
          bun run tauri android build --apk --debug --ci

      # ── Sign & Organize ────────────────────────────────────────
      - name: Sign & Organize APKs
        shell: bash
        run: |
          mkdir -p dist-apks

          echo "[CI] Generating ad-hoc signing key..."
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias noor-release \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass noor1234 -keypass noor1234 \
            -dname "CN=NoorAlQuran, OU=Mobile, O=Noor, C=PK" 2>/dev/null

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign   | sort -V | tail -n 1)
          echo "[CI] apksigner: $APKSIGNER"
          echo "[CI] zipalign:  $ZIPALIGN"

          while IFS= read -r apk; do
            filename=$(basename "$apk")
            echo "Processing: $filename"

            if [[ "$filename" == *"unsigned"* ]]; then
              signed="Noor-Al-Quran-v${{ env.APP_VERSION }}-release-signed.apk"
              aligned="aligned-tmp.apk"
              $ZIPALIGN -p -f 4 "$apk" "$aligned"
              $APKSIGNER sign \
                --ks release.jks \
                --ks-pass pass:noor1234 \
                --ks-key-alias noor-release \
                --key-pass pass:noor1234 \
                --out "dist-apks/$signed" \
                "$aligned"
              rm -f "$aligned"
              echo "[CI] Signed release APK → dist-apks/$signed"
            else
              dest="dist-apks/Noor-Al-Quran-v${{ env.APP_VERSION }}-debug.apk"
              cp "$apk" "$dest"
              echo "[CI] Staged debug APK → $dest"
            fi
          done < <(find src-tauri/gen/android -name "*.apk" -type f)

          ls -lh dist-apks/

      # ── Upload artifacts ───────────────────────────────────────
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Quran-v${{ env.APP_VERSION }}-Android-APKs
          path: dist-apks/*.apk
          retention-days: 30

      # ── Attach to GitHub Release ───────────────────────────────
      - name: Attach APKs to GitHub Release
        if: inputs.upload_url != '' || (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: dist-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
