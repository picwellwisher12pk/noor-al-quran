name: Build Android APK

on:
  push:
    branches:
      - main
      - production
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract App Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted App Version: v$VERSION"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager --install \
            "ndk;26.1.10909125" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools"
          
          # Find NDK path
          NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Rust Cargo-NDK
        run: cargo install cargo-ndk

      - name: Install Dependencies
        run: bun install

      - name: Initialize Tauri Android (if not initialized)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "[CI] Initializing Tauri Android project..."
            bun run tauri android init --ci
          else
            echo "[CI] Android project already initialized."
          fi

      - name: Inject Android Permissions (Microphone & Internet for Verse Identifier)
        run: |
          MANIFEST_FILE="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            echo "[CI] Ensuring Android permissions in $MANIFEST_FILE..."
            # Check and inject RECORD_AUDIO if missing
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST_FILE"
              echo "[CI] Injected RECORD_AUDIO and INTERNET permissions."
            fi
          fi

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          echo "[CI] Building Android APK with version v${{ env.APP_VERSION }}..."
          # Build target APKs (aarch64 is standard for 99% of modern phones)
          bun run tauri android build --apk --ci --target aarch64,armv7,x86_64 || bun run tauri android build --apk --ci --target aarch64

      - name: Organize & Rename Generated APKs
        run: |
          mkdir -p dist-apks
          echo "[CI] Searching for generated APK files..."
          find src-tauri/gen/android -name "*.apk" -type f
          
          # Copy and rename APKs with version string
          for apk in $(find src-tauri/gen/android -name "*.apk" -type f); do
            filename=$(basename "$apk")
            dest="dist-apks/Noor-Al-Quran-v${{ env.APP_VERSION }}-${filename}"
            cp "$apk" "$dest"
            echo "Staged APK: $dest"
          done

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Quran-v${{ env.APP_VERSION }}-Android-APKs
          path: dist-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (Optional Tag Trigger)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apks/*.apk
          name: "Noor Al-Quran v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
