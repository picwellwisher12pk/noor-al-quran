name: Build Desktop Apps

on:
  push:
    branches:
      - main
      - production
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - name: Linux-x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - name: macOS
            os: macos-latest
            rust-target: aarch64-apple-darwin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract App Version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted App Version: v$VERSION"

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Project Dependencies
        run: bun install

      - name: Build Tauri Desktop Application
        run: bun run tauri:build

      - name: Stage Desktop Installers
        shell: bash
        run: |
          mkdir -p dist-desktop
          echo "[CI] Locating generated installers in src-tauri/target/release/bundle..."
          find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} dist-desktop/ \;
          ls -lh dist-desktop/

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Quran-v${{ env.APP_VERSION }}-${{ matrix.platform.name }}
          path: dist-desktop/*
          retention-days: 30

      - name: Publish to GitHub Release (Optional Tag Trigger)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*
          name: "Noor Al-Quran v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
