[package]
name = "noor-al-quran"
version = "1.8.2"
description = "Noor Al-Quran (نور القرآن) Desktop Workstation"
authors = ["Noor Al-Quran Team"]
edition = "2021"

[lib]
name = "noor_al_quran_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
